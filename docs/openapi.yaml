openapi: 3.0.3

info:
  title: Otaku Data Platform · 接口契约（阶段 1–2）
  version: 1.1.0-draft
  description: |
    本文件是《第一阶段最小契约》（docs/stage1-minimal-contract.md）与
    《第二阶段契约草案》（docs/stage2-account-collection-contract.md）的机器可读版本。

    阶段 1（四个接口中的 HTTP 部分，以及 ③④ 共用的封面出口）：

    - **② 数据写入接口** `POST /internal/import/batches`（Python → Java）
    - **③ 作品列表接口** `GET /api/works`（Flutter → Java）
    - **④ 作品详情接口** `GET /api/works/{work_id}`（Flutter → Java）
    - **⑤ 封面代理接口** `GET /api/covers/{work_id}`（Flutter → Java）——
      `cover_url` 指向这里，不是来源站地址

    阶段 2（账号与个人数据，覆盖验收 C1–C11）：

    - `POST /api/auth/login`、`GET /api/auth/me`、`POST /api/auth/logout`
    - `GET|PUT|PATCH|DELETE /api/me/collections/{work_id}`、`GET /api/me/collections`
    - `POST /internal/accounts`（内部建号，**不是客户端契约**）

    **接口①「网站接入」不在本文件。** 那是平台**只读拉取**来源站，来源站的接口不由我们定义，
    接入规范（拿什么、不拿什么、网站需具备什么能力）见契约第 4 节。

    阶段 2 不提供自助注册、找回密码、refresh token、与来源站账号互通。
    本文件只描述请求与响应的**形状**；字段语义、可空规则、创建与更新规则以契约正文为准。

    三条边界：
    1. 数据单向流动：网站 → 平台 → 客户端，平台不回写网站。
    2. 只有 Java 写业务数据库；Python 只经接口②提交。
    3. 空值一律 `null`，不用 `""`、`0`、"暂无" 之类的伪值填充。
  contact:
    name: 契约讨论
    url: https://github.com/otaku-dev-team/otaku-data-platform/issues/3

servers:
  - url: http://localhost:8080
    description: |
      Java 后端默认端口。**此地址只适用于桌面端，以及在宿主机上直接调用接口的场景。**

      换端时必须改地址，不能照搬：
      - Android 模拟器 → `http://10.0.2.2:8080`（`10.0.2.2` 是模拟器访问宿主机的固定别名，`localhost` 在模拟器里指模拟器自身）
      - 真机 → 宿主机在局域网内的可达地址，且该地址要能被手机访问到

      阶段 1 验收口径明确要求：手机用可访问的服务地址联调，**不得把电脑的 `localhost` 当手机后端地址**。

tags:
  - name: 内部导入
    description: 仅供 Python 同步作业调用，客户端不得持有内部令牌
  - name: 作品查询
    description: Flutter 手机端与桌面端共用的公开读接口
  - name: 账号
    description: 阶段 2：登录、当前用户、退出。不开放自助注册
  - name: 个人收藏
    description: 阶段 2：本人收藏与观看状态，路径里永不出现 user_id
  - name: 内部账号
    description: 阶段 2：仅内网可用的建号接口，客户端不得持有内部令牌

security: []

paths:

  /api/works:
    get:
      tags: [作品查询]
      summary: 作品列表与关键词搜索（接口③）
      operationId: listWorks
      description: |
        分页返回作品列表。**列表不返回 `summary`**——来源简介最长 7225 字，会把列表响应撑爆。

        边界约定：
        - 无匹配时返回 `200` + `items: []` + `total: 0`，不是 404。
        - `page` 超出 `total_pages` 时返回 `200` + 空数组。
        - `page_size` 超过 50 时**按 50 截断**，不报错。
        - 排序由 `sort` 指定，默认 `id`；无论哪种排序都必须**稳定**（同一查询多次返回顺序一致）。
      parameters:
        - name: type
          in: query
          description: 作品类型过滤，省略表示全部类型
          schema:
            type: string
            enum: [anime, comic, game, novel]
        - name: q
          in: query
          description: |
            标题关键词，子串匹配、忽略大小写。不支持别名与拼音
            （别名来源未出口，第一阶段做不到）。省略表示不过滤。
          schema: { type: string, maxLength: 100 }
        - name: tag
          in: query
          description: |
            **标签精确匹配**（不做模糊、不做分词），可与 `type` / `q` / `sort` 组合。

            - 未知标签**不报错**：返回 `200` + `items: []` + `total: 0`
              （标签是数据里的值、不是接口枚举，来源站改名后旧链接属「没有结果」）。
            - 超过 64 字符按 64 截断（与该列宽度一致），不报错。
            - 匹配的是**整个标签**：`科幻` 不会命中 `科幻机甲`。
          schema: { type: string, maxLength: 64, example: 科幻 }
        - name: sort
          in: query
          description: |
            排序方式，省略等价于 `id`。三种取值都**降序在前**，并以 `id` 作次级键保证分页稳定：

            | 取值 | 顺序 | 无值作品（`null`） |
            | --- | --- | --- |
            | `id`（默认） | 入库顺序升序 | — |
            | `rating` | 评分高 → 低 | 排最后 |
            | `year` | 年份新 → 旧 | 排最后 |

            **非法取值返回 400**（`BAD_REQUEST`），与「查不到结果」区分开。
          schema:
            type: string
            enum: [id, rating, year]
            default: id
        - name: min_rating
          in: query
          description: |
            榜单评分下限：只返回评分 **≥** 该值的作品，**无评分（`null`）一律排除**。

            与 `sort=rating` 的「无评分沉底」互补：沉底只是排在最后、作品仍在结果里；
            榜单要的是「没有评分就不参与排名」，所以这里把它们移出结果集。
            `min_rating=0` 的语义是「只要有过评分」。可与 `type` / `q` / `tag` / `sort` 任意组合。

            尺度取 0–10（库内 `rating_scale` 当前均为 `0-10`）。非法值（非数字、负数、超上限）返回 `400`
            （`BAD_REQUEST`），与「筛出来是空的」区分开。
          schema: { type: number, minimum: 0, maximum: 10, example: 7.0 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          description: 单页条数，上限 50
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Paging"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/WorkSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}:
    get:
      tags: [作品查询]
      summary: 作品详情（接口④）
      operationId: getWork
      description: |
        按 `work_id` 取全部 11 个字段。

        `work_id` 一律当作**不透明字符串**：不解析其结构，不做数值比较。
        不存在与格式非法**都返回 404**，不用错误码区分"是否存在"。
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 成功，直接返回作品对象（不再套一层 data）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Work" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/works/{work_id}/related:
    get:
      tags: [作品查询]
      summary: 同标签推荐（详情页底部，新增）
      operationId: getRelatedWorks
      description: |
        按**共享标签**取若干相关作品，供详情页底部「相关内容推荐」渲染。

        边界约定：
        - 作品不存在或 `work_id` 格式非法 → **404**（与详情一致）。
        - 作品**没有标签** → `200` + `basis_tags: []` + `items: []`，不是 404、不是空错误。
        - `limit` 省略为 6，超过 20 按 20 截断，不报错。
        - 排序为评分高 → 低（无评分排最后）；不返回作品自身。
        - **按标题去重**（trim + 小写归一的键，保留评分更高的那条）：多来源并存
          意味着同一作品可能有 2 条以上（实测 13,261 组跨源同名），不去重推荐位
          会连着出现同一个名字。去重后不足 `limit` 时**按实际数量返回**，不补位。

        `basis_tags` 是**本次实际参与匹配的标签**（最多 5 个），客户端据此展示
        「同题材：科幻、机战」这类理由。为空表示该作品没有标签，此时 `items` 必为空。

        性能：依赖 `idx_work_rating` 反向扫描提前终止，55.6 万条实测约 3ms；
        不要改成「按共享标签数排序」，那需要全表算分（实测约 1s）。
      parameters:
        - $ref: "#/components/parameters/WorkId"
        - name: limit
          in: query
          description: 返回条数，上限 20
          schema: { type: integer, minimum: 1, maximum: 20, default: 6 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RelatedWorks" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/schedule:
    get:
      tags: [作品查询]
      summary: 每日新番档期（按星期分组）
      operationId: getSchedule
      description: |
        接口⑤：每日新番档期（公开，客户端可直连）。按星期分组返回当前/指定季度的档期。

        边界约定（与作品列表一致）：
        - 无匹配 → `200` + 空分组，不是错误；`season` 传不存在的值同样返回空分组，由客户端显示空状态。
        - `season` 省略 → 取库内最新季度；库里没有任何数据时 `season` 与 `seasons` 均为 `null`，`groups` 为 8 个空组。
        - `groups` 固定 8 组（周一…周日 + 待定），`weekday = null` 的待定组排在最后，与站点一致。
        - 某条档期命中本地作品时 `work_id` 非空，客户端可据此跳转本地详情；`null` 时只展示、不给死链。
      parameters:
        - name: season
          in: query
          required: false
          description: 季度编码（如 202504）；省略取库内最新季度
          schema: { type: string, pattern: "^[0-9]{6}$", example: "202504" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchedulePage" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/schedule/seasons:
    get:
      tags: [作品查询]
      summary: 可用季度列表
      operationId: listScheduleSeasons
      description: |
        全部可用季度，新的在前。给「切换季度」下拉用。库里没有任何档期时返回空数组。
      responses:
        "200":
          description: 成功，字符串数组（如 ["202504","202501"]），新的在前
          content:
            application/json:
              schema:
                type: array
                items: { type: string, pattern: "^[0-9]{6}$" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/covers/{work_id}:
    get:
      tags: [作品查询]
      summary: 作品封面代理（③④ 的配套出口）
      operationId: getWorkCover
      description: |
        取封面图片本体。列表与详情返回的 `cover_url` 指向这里，客户端只消费
        `cover_url`，**不直连来源站**（契约第 2.1 节）。

        边界约定：
        - `cover_url` 为 `null` 时客户端**不应**发起本请求，直接显示占位图（契约 6.3）。
        - 本地缓存未命中才回源一次，并按来源站限流缓存；命中后由平台直接服务，
          不再受来源站约 43 分钟缓存期影响。
        - 回源失败视为服务端错误，客户端按 `INTERNAL` 处理，不要退化成直连来源站。
        - `work_id` 与接口④ 同一条不透明字符串规则；不存在返回 `404`。
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 封面图片字节（不套 JSON 信封）
          headers:
            ETag:
              description: 内容指纹，客户端可用 `If-None-Match` 做协商缓存
              schema: { type: string }
            Cache-Control:
              description: 平台侧缓存策略；来源站自身缓存期仅约 43 分钟，此处由平台决定
              schema: { type: string }
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "304":
          description: If-None-Match 命中，客户端复用本地缓存（无响应体）
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/batches:
    post:
      tags: [内部导入]
      summary: 提交一个同步批次（接口②）
      operationId: submitImportBatch
      description: |
        Python 同步作业专用，不对外暴露。

        幂等：同一个 `batch_id` 重复提交返回首次结果，不重复入库。
        单批上限 500 条，超出返回 `413 BATCH_TOO_LARGE`，Python 需自行拆批。

        创建与更新规则：
        - `(source, source_id)` 未命中 → 创建；必填项缺失则整条 rejected。
        - 命中 → 只覆盖本次**出现且非 `null`** 的字段；`null` 表示本次没数据，不覆盖。
        - `tags: []` 表示明确无标签，会清空；`tags: null` 不清空。
          **第一阶段适配器只会发 `null`**——来源站的空标签是 `[]` 且无法区分"无标签/未录入"
          （实测 38.5% 为空），按"明确无标签"处理会在缺数据时误清空已有标签。
          `[]` 的语义保留给后续能区分两种空值的来源，见契约第 4.4.3 节。
        - `work_id` 首次创建时生成，此后不因内容变更而改变。
        - 来源侧消失的作品**不删除**。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportBatchRequest" }
      responses:
        "200":
          description: 批次处理完成，逐条结果见 counts 与 errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  /internal/import/batches/{batch_id}:
    get:
      tags: [内部导入]
      summary: 查询批次结果（重跑前核对用）
      operationId: getImportBatch
      security:
        - internalToken: []
      parameters:
        - name: batch_id
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: with_runs
          in: query
          required: false
          description: |
            传 `true` 时额外返回**逐次运行明细**；不传或传其它值，返回形状与阶段 1 完全一致。

            为什么需要：`batch_id` 由 source_id 集合哈希得出、不含运行序号，
            同一天重跑会覆盖汇总计数。要回答"这批推了几轮、哪轮 rejected 变多"，只能逐次记录。
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 成功（`with_runs=true` 时为 ImportBatchDetail，否则为 ImportBatchResult）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ImportBatchResult"
                  - $ref: "#/components/schemas/ImportBatchDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # 接口⑤：每日新番档期（内部导入侧，接口②的档期分支）
  # ---------------------------------------------------------------------------

  /internal/import/schedules:
    post:
      tags: [内部导入]
      summary: 提交一个档期同步批次（接口②档期侧）
      operationId: submitScheduleImportBatch
      description: |
        Python 同步作业专用，不对外暴露。与作品的 `/internal/import/batches` 平行：
        两种条目字段、校验、合并逻辑不同，故拆成独立端点而非共用一个带 entity 参数的端点。

        批次记录仍走同一张 import_batch 表，运维侧同一套口径。
        幂等、单批上限、创建/更新/`null` 不覆盖、`(source, source_id)` 唯一键、来源侧消失不删除——
        全部与 ImportBatchRequest 一致（见该 schema 说明）。
        差异：条目字段为档期侧（`ScheduleImportItem`），`work_tags` 收**数组**（站点给斜杠字符串，
        转换在同步侧做），`content_id` 原样透传，关联本地作品由后端按 `(source, source_id)` 尽力匹配。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleImportRequest" }
      responses:
        "200":
          description: 批次处理完成，逐条结果见 counts 与 errors
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportBatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/BatchTooLarge" }
        "429": { $ref: "#/components/responses/RateLimitedWithRetry" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ---------------------------------------------------------------------------
  # 阶段 2：账号与个人数据
  # 语义与错误处理以 docs/stage2-account-collection-contract.md 为准
  # ---------------------------------------------------------------------------

  /api/auth/login:
    post:
      tags: [账号]
      summary: 用户名密码换令牌（每次调用产生一条新会话）
      operationId: login
      description: |
        每次调用产生一条新会话，**不踢掉任何已有会话**（C1）。

        失败一律 `401 INVALID_CREDENTIALS`，不区分「用户不存在」与「密码错」，避免账号枚举。

        同一账号 5 次失败后进入限流：15 分钟滑动窗口，期间返回 `429 RATE_LIMITED`，
        `Retry-After` 给出还需等待的秒数。**只限流、不锁号**，窗口滑过自动恢复；
        成功登录会清空该账号的失败计数，正常用户不会被误伤。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: 登录成功。`token` 只在此处返回一次，客户端自行安全保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: 账号或密码不正确（INVALID_CREDENTIALS）。不区分「用户不存在」与「密码错」
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/auth/me:
    get:
      tags: [账号]
      summary: 校验令牌并返回当前用户
      operationId: getCurrentUser
      description: 客户端冷启动时用它判断是否已登录；失败只清会话，不弹错误页
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/auth/logout:
    post:
      tags: [账号]
      summary: 撤销当前令牌（只影响本设备）
      operationId: logout
      description: |
        只撤销当前令牌，其他设备的会话不受影响（C9）。

        **已失效或不带令牌调用也返回 `204`**，因此本接口不要求鉴权——
        客户端退出流程不应因为令牌已过期而卡在 401 分支上。无请求体。
      security: []
      responses:
        "204":
          description: 已撤销；或本来就没有有效会话（幂等）

  /api/me/collections:
    get:
      tags: [个人收藏]
      summary: 本人收藏分页列表
      operationId: listCollections
      description: |
        - 排序：`updated_at DESC, work_id ASC`（第二个键保证同秒写入时分页不跳条）。
        - **不返回 `summary`**，与作品列表一致；也不返回 `tags` 与评分。
        - 空收藏返回 `200` + `items: []` + `total: 0`。
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: |
            按观看状态过滤。省略表示全部；`none` 表示「已收藏但未设状态」。
          schema:
            type: string
            enum: [want, watching, watched, none]
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          description: 超过 50 时按 50 截断，不报错
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /api/me/collections/{work_id}:
    get:
      tags: [个人收藏]
      summary: 单条收藏状态（未收藏也是 200）
      operationId: getCollectionState
      description: |
        「未收藏」是正常结果，不是错误：返回 `200` + `collected: false`。
        只有**作品本身不存在**时才返回 `404 WORK_NOT_FOUND`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "200":
          description: 成功（`collected` 区分是否已收藏）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionState" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "404": { $ref: "#/components/responses/NotFound" }

    put:
      tags: [个人收藏]
      summary: 加入收藏（幂等 upsert）
      operationId: putCollection
      description: |
        记录不存在则创建，已存在则覆盖为给定 `status`；重复提交结果一致。
        `status` 可省略，表示收藏但不设状态。一律返回 `200`，不用 `201`。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdateRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "404": { $ref: "#/components/responses/NotFound" }

    patch:
      tags: [个人收藏]
      summary: 只改状态、不创建（C11 的前提）
      operationId: patchCollection
      description: |
        **只改不建**：记录不存在时返回 `409 COLLECTION_REQUIRED`，绝不自动重新收藏。
        这是验收 C11（过期界面改状态）成立的唯一方式；用 `PUT` 会静默重建收藏、C11 直接失败。

        `status` 传 `null` 表示清除状态但保留收藏。
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionUpdateRequest" }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/UnauthorizedSession" }
        "409": { $ref: "#/components/responses/ConflictCollection" }

    delete:
      tags: [个人收藏]
      summary: 取消收藏（幂等）
      operationId: deleteCollection
      description: 删除整条记录，`status` 随之消失（C4）；记录不存在也返回 `204`
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkId"
      responses:
        "204":
          description: 已取消（或本来就没收藏）
        "401": { $ref: "#/components/responses/UnauthorizedSession" }

  /internal/accounts:
    post:
      tags: [内部账号]
      summary: 内部建号（首期不开放自助注册）
      operationId: createAccount
      description: |
        联调账号 A / B 由此创建。客户端**不得**持有内部令牌，因此该接口不对外暴露。
        不返回会话：建号后仍需走 `POST /api/auth/login`。
      security:
        - internalToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAccountRequest" }
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ConflictUsername" }

components:

  securitySchemes:
    internalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
      description: 内部服务令牌。仅同步作业持有，客户端与前端**不得**持有该密钥。
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        客户端会话令牌：43 字符 Base64URL 不透明串，**不得解析其内容**。
        只放 `Authorization` 头（`Bearer <token>`），不放在 URL 查询串里——
        查询串会进访问日志与浏览器历史。服务端只存其 SHA-256，30 天固定有效期。
        收到 401 时客户端应清本地会话并回到登录页，不要重试。

  parameters:
    WorkId:
      name: work_id
      in: path
      required: true
      description: 平台内部标识，由 Java 生成，客户端只当不透明字符串使用
      schema: { type: string }

  responses:
    BadRequest:
      description: 请求格式或参数不合法（不重试，修正后重发）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unauthorized:
      description: 内部令牌缺失或无效（不重试）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnauthorizedSession:
      description: |
        会话令牌缺失、无效、已退出或已过期（`UNAUTHORIZED`）。
        客户端应静默清除本地会话并回到登录页，**不要**提示服务端错误、不要重试。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictCollection:
      description: |
        该作品当前不在收藏中（`COLLECTION_REQUIRED`），通常是另一端已经取消收藏。
        客户端应提示「收藏已失效，请刷新」，重新拉单条状态后重绘；**不得**自动重新提交。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ConflictUsername:
      description: 用户名已被占用（`USERNAME_TAKEN`）。大小写不敏感，`Alice` 与 `alice` 视为同名
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 作品或批次不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BatchTooLarge:
      description: 单批条数超过 500（Python 拆批后重发）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 限流（重试，带退避）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimitedWithRetry:
      description: |
        登录失败次数超限（`RATE_LIMITED`）。`Retry-After` 为还需等待的秒数（≤ 900），
        客户端应按该值退避后再试，**不要**立刻重试、也不要展示成"账号被锁"。
      headers:
        Retry-After:
          description: 建议等待的秒数
          schema: { type: integer, example: 900 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 服务端错误（重试，带退避）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:

    Paging:
      type: object
      required: [page, page_size, total, total_pages, items]
      properties:
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 20 }
        total:
          type: integer
          description: 符合条件的总数。客户端靠它判断是否末页，必须返回
          example: 7894
        total_pages: { type: integer, example: 395 }
        items:
          type: array
          items: {}

    SourceRating:
      type: object
      nullable: true
      description: |
        来源评分。`null` 表示来源没有评分，**不是 0 分**，客户端必须不显示评分区域，
        不得显示 `0.0`。
      required: [value, scale, source]
      properties:
        value:
          type: number
          example: 7.8
        scale:
          type: string
          enum: ["0-10"]
          description: |
            评分尺度。**只接受 `0-10`**，其它取值该条 `rejected`（`RATING_OUT_OF_SCALE`）——
            来源若使用别的尺度，由适配器换算后再提交，不能原样入库。
            原因：排序与过滤只比较 `value`，不比较尺度；混入 0-100 会让排行榜与 `min_rating` 静默错位。
        source:
          type: string
          example: otaku_site

    WorkSummary:
      type: object
      description: |
        列表项。**8 个字段，不含 `summary`**——简介最长 7225 字，列表带上会把响应撑爆，
        客户端需要简介时按 `work_id` 拉详情。
      required: [work_id, work_type, title]
      properties:
        work_id: { type: string, example: "W-8f3a91" }
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title: { type: string, example: 街角魔族 2丁目 }
        release_year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: |
            来源站年份原值。**`null` = 来源未提供，不是 0 年**；客户端为 `null` 时不渲染年份。
            来源站实测非空率约 95.9%（2026-10-22 抽样），个别作品仍会缺。
          example: 2022
        cover_url:
          type: string
          nullable: true
          description: |
            平台后端代理 + 本地缓存地址（Java 首次回源后缓存，之后由平台服务；客户端不直连来源站）。
            `null` 表示无封面，客户端显示占位图。
          example: https://api.example.com/covers/W-8f3a91
        tags:
          type: array
          nullable: true
          description: |
            `null` = 来源未提供；`[]` = 明确无标签（客户端不渲染标签区）。
            来源侧每条最多 5 个（站方截断），不宜作为主要筛选维度。
          items: { type: string }
          example: ["日常", "搞笑"]
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        source:
          type: string
          nullable: true
          description: |
            记录所属来源站的标识，取值域与 `Work.source` 一致（如 `otaku_site` / `bangumi`）。
            2026-10-24 补入（第 8 个字段）：列表 SQL 原本就 select 了 `source`，只是没往列表 DTO 透出。

            **用途只有一个：可辨识。** 同一标题出现两条记录时，客户端靠它标出来源，
            避免用户把两部不同作品当成同一部（实测 13,261 组跨源同名）。
            按「齐平原则」（见站点特色功能适配方案 §8）它是**透明度底线**——
            目录里只要存在非本站的记录，用户就必须能分辨；**它不是归并的前奏**，
            也不意味着不同来源的记录被认定是同一部作品。
            `null` = 来源未标注，客户端此时不渲染来源标识。
          example: bangumi

    RelatedWorks:
      type: object
      description: |
        详情页「相关内容推荐」。
        `basis_tags` 是本次实际参与匹配的标签（最多 5 个）；它为空时 `items` 必为空。
      required: [basis_tags, items]
      properties:
        basis_tags:
          type: array
          description: 用于匹配的标签；为空表示该作品没有标签，无法推荐
          items: { type: string }
          example: ["科幻", "机战"]
        items:
          type: array
          description: 相关作品，评分高 → 低，不含当前作品
          items: { $ref: "#/components/schemas/WorkSummary" }

    Work:
      type: object
      description: |
        详情。**全部 12 个字段**（含本阶段新增的可空 `source_url` 与 `release_year`）。
        列表项是 7 字段（含 `release_year`），不含
        `summary` / `source` / `source_id` / `source_url` / `updated_at`。
      required: [work_id, work_type, title, source, source_id, updated_at]
      properties:
        work_id:
          type: string
          description: 平台内部标识，不透明，客户端所有业务只认它
          example: "W-8f3a91"
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title: { type: string, example: 街角魔族 2丁目 }
        summary:
          type: string
          nullable: true
          description: |
            换行已统一为 `\n`，**不截断**（最长 7225 字），折叠由客户端处理。
            `null` 表示来源没有简介，客户端显示"暂无简介"。
        release_year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: |
            来源站年份原值。`null` = 来源未提供，不是 0 年。
            与 `main_rating` 一样，可空字段**以 `null` 出现而不是被省略**。
          example: 1995
        cover_url: { type: string, nullable: true, description: 平台后端代理+缓存地址（同列表项）；null 表示无封面 }
        tags:
          type: array
          nullable: true
          items: { type: string }
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        source:
          type: string
          description: 接入方唯一标识。已知取值 otaku_site（站点 API）、bangumi（Bangumi 档案）
          example: otaku_site
        source_id:
          type: string
          description: |
            来源站内作品 ID，字符串存储。可返回给客户端做溯源展示，
            但**客户端不得用它做业务判断**（跨站可能重复）。
          example: "476"
        source_url:
          type: string
          nullable: true
          description: |
            来源站的**人读原页**地址（不是 API 地址），由来源适配器在入库时提供，平台原样返回。

            - `null` 表示适配器无法可靠确定原页，客户端**不要**自己拼接、不要猜；
            - 客户端只用于「打开原页」这类导航，**不得**用它抓取数据；
            - 只允许打开可信的 HTTP/HTTPS 地址，其它协议的数据在入库时已被丢弃；
            - 缺失不影响作品的其他功能。
          example: "http://154.8.194.198:8000/contents/476"
        updated_at:
          type: string
          format: date-time
          description: 该记录最后一次变更时间，由 Java 维护，RFC 3339

    SchedulePage:
      type: object
      description: |
        一页档期。按星期分组返回而不是平铺列表：客户端「每日新番」页就是周一…周日分组布局，
        服务端分组可少传 7 次星期字段，客户端也少一层 groupBy。
      required: [season, seasons, groups]
      properties:
        season:
          type: string
          nullable: true
          description: 本次返回的季度；库里没有任何档期时为 null
          pattern: "^[0-9]{6}$"
          example: "202504"
        seasons:
          type: array
          description: 全部可用季度（新的在前），给「切换季度」下拉用；无数据时为空数组
          items: { type: string, pattern: "^[0-9]{6}$" }
        groups:
          type: array
          description: 按星期分组的档期，固定 8 组（周一…周日 + 待定）；空季度时组内为空
          items: { $ref: "#/components/schemas/ScheduleGroup" }

    ScheduleGroup:
      type: object
      required: [weekday, label, items]
      properties:
        weekday:
          type: integer
          nullable: true
          description: 星期几（1=周一 … 7=周日）；null = 待定组，排在最后
          minimum: 1
          maximum: 7
          example: 2
        label:
          type: string
          description: 分组标签，如「周二」
          example: 周二
        items:
          type: array
          description: 该星期的档期条目
          items: { $ref: "#/components/schemas/ScheduleItem" }

    ScheduleItem:
      type: object
      description: 一条档期。
      required: [scheduleId, seasonCode]
      properties:
        scheduleId:
          type: string
          description: 档期记录主键（来源站侧），不透明
          example: "sch-202504-12345"
        seasonCode: { type: string, pattern: "^[0-9]{6}$", example: "202504" }
        titleMain: { type: string, description: 主标题（来源站语言）, example: 葬送的芙莉莲 }
        titleCn: { type: string, nullable: true, description: 中文译名；无则 null }
        titleJp: { type: string, nullable: true, description: 日文原名；无则 null }
        weekday:
          type: integer
          nullable: true
          minimum: 1
          maximum: 7
          description: 播出星期（1=周一…7=周日）；null=待定
        broadcastTime:
          type: string
          nullable: true
          description: 播出时间（来源站原格式，如「23:30」）；无则 null
        broadcastNote:
          type: string
          nullable: true
          description: 播出备注（如「每周五 深夜」）；无则 null
        workType:
          type: string
          nullable: true
          enum: [anime, comic, game, novel]
          description: 类型；来源未给则 null
        workTags:
          type: array
          nullable: true
          description: 标签；null=来源未提供
          items: { type: string }
          example: ["奇幻", "冒险"]
        imageUrl:
          type: string
          nullable: true
          description: 封面图地址（来源站原图）；无则 null，客户端显示占位图
        platforms:
          type: array
          nullable: true
          description: 播放平台列表；无则 null
          items: { $ref: "#/components/schemas/SchedulePlatform" }
        sourceUrl:
          type: string
          nullable: true
          description: 来源站人读原页；null 时不渲染回流入口（同契约 source_url 规则）
        workId:
          type: string
          nullable: true
          description: 命中本地作品时为其 work_id，客户端据此跳转本地详情；null 时只展示、不给死链

    SchedulePlatform:
      type: object
      required: [name, url]
      properties:
        name: { type: string, example: bilibili }
        url: { type: string, format: uri, example: "https://www.bilibili.com/bangumi" }

    ScheduleImportRequest:
      type: object
      required: [batch_id, source, items]
      properties:
        batch_id:
          type: string
          maxLength: 128
          description: 幂等键，格式与 ImportBatchRequest 一致（`{source}-schedule-{日期}-{内容指纹}`）
          example: bangumi-schedule-20261022-9c1f3a
        source:
          type: string
          enum: [otaku_site, bangumi]
          description: 接入方唯一标识；档期侧目前由同步器按来源填充
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 本次拉取时间，仅作排查参考
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ScheduleImportItem" }

    ScheduleImportItem:
      type: object
      description: 档期提交项。字段命名与站点 GET /api/schedule 对齐（snake_case）。
      required: [sourceId, seasonCode, titleMain]
      properties:
        sourceId: { type: string, minLength: 1, description: 来源站档期 ID }
        seasonCode: { type: string, pattern: "^[0-9]{6}$", example: "202504" }
        titleMain: { type: string, minLength: 1, maxLength: 500, description: 主标题 }
        titleCn: { type: string, nullable: true, maxLength: 500 }
        titleJp: { type: string, nullable: true, maxLength: 500 }
        weekday: { type: integer, nullable: true, minimum: 1, maximum: 7 }
        broadcastTime: { type: string, nullable: true }
        broadcastNote: { type: string, nullable: true }
        workType: { type: string, nullable: true, enum: [anime, comic, game, novel] }
        workTags:
          type: array
          nullable: true
          description: 站点给斜杠字符串（如「奇幻/冒险」），同步侧拆成数组后提交；null=未提供
          items: { type: string }
        imageUrl: { type: string, nullable: true, description: 封面图地址；空串在同步侧转 null }
        platforms:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/SchedulePlatform" }
        sourceUrl:
          type: string
          nullable: true
          maxLength: 1024
          description: 来源站人读原页；只接受 http/https
        contentId:
          type: string
          nullable: true
          description: 原样透传的来源站内容 ID；关联本地作品由后端按 (source, source_id) 尽力匹配
        sourceUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: 来源侧该条目的更新时间；用于增量判断

    ImportBatchRequest:
      type: object
      required: [batch_id, source, items]
      properties:
        batch_id:
          type: string
          maxLength: 128
          description: |
            幂等键，格式 `{source}-{类型}-{日期}-{内容指纹}`，
            指纹为排序后 source_id 集合的哈希。同一批输入重跑必须得到同一个 batch_id。
          example: otaku_site-anime-20261020-3a9f1c
        source:
          type: string
          description: |
            接入方唯一标识（见契约第 4.6 节）。已知取值：otaku_site（现有站点 API）、
            bangumi（Bangumi 官方数据集档案，见 sync-python 适配器）。后端按字符串存储、
            不做白名单校验，新增来源按约定加适配器和 source 取值即可。
          enum: [otaku_site, bangumi]
        fetched_at:
          type: string
          format: date-time
          nullable: true
          description: 本次拉取时间，仅作排查参考，不参与业务判断
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/ImportItem" }

    ImportItem:
      type: object
      description: |
        提交项 9 个字段。`work_id` 由 Java 生成、`updated_at` 由 Java 维护、`source` 在批次级，
        因此都不出现在条目里。

        `source_url` 与 `release_year` 都是**可选**字段：适配器能可靠确定时提供，
        确定不了就传 `null`（或不传），**不要猜**。平台原样入库，详情接口返回。
      required: [source_id, work_type, title]
      properties:
        source_id:
          type: string
          minLength: 1
          description: 来源站作品 ID。与批次级 source 共同构成唯一键
          example: "476"
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title:
          type: string
          minLength: 1
          maxLength: 500
          description: 来源标题原文，不做跨类型转换、不做截断
        summary:
          type: string
          nullable: true
          description: 换行已统一为 \n；来源缺失传 null，不传空字符串
        cover_url:
          type: string
          nullable: true
          description: 已拼成绝对地址；空串在 Python 侧已转为 null
        release_year:
          type: integer
          nullable: true
          minimum: 1900
          maximum: 2100
          description: |
            年份原值，**可省略或传 `null`**（= 来源未提供）。省略时保留库中原值，不会清空。
            越界（如 0、1899、2101）整条拒收，错误码 `INVALID_RELEASE_YEAR`。
            允许省略是为了让旧版同步器不改也能继续工作。
          example: 2022
        tags:
          type: array
          nullable: true
          description: |
            `null` = 本次没拿到（不覆盖已有值）；`[]` = 明确无标签（清空）。
            两者语义不同，不要混用。
          items: { type: string }
        main_rating: { $ref: "#/components/schemas/SourceRating" }
        source_url:
          type: string
          nullable: true
          maxLength: 1024
          description: |
            来源站**人读原页**地址（不是 `/api/...` 接口地址）。
            只接受 http/https；其它协议或超长值会被平台丢弃（不拒收整条，只把该字段置 null）。
          example: "http://154.8.194.198:8000/contents/476"

    ImportBatchResult:
      type: object
      required: [batch_id, counts, errors]
      properties:
        batch_id: { type: string }
        counts:
          type: object
          required: [inserted, updated, unchanged, rejected]
          properties:
            inserted: { type: integer, example: 97 }
            updated: { type: integer, example: 3 }
            unchanged: { type: integer, example: 0 }
            rejected: { type: integer, example: 0 }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        errors:
          type: array
          description: 只需失败明细与提示项，成功条目不必逐条回传
          items: { $ref: "#/components/schemas/ImportItemResult" }

    Counts:
      type: object
      description: 逐条结果的四类计数
      required: [inserted, updated, unchanged, rejected]
      properties:
        inserted: { type: integer, example: 97 }
        updated: { type: integer, example: 3 }
        unchanged: { type: integer, example: 0 }
        rejected: { type: integer, example: 0 }

    ImportBatchRun:
      type: object
      description: 一次导入运行的明细（`?with_runs=true` 才有）
      required: [run_seq, counts, started_at]
      properties:
        run_seq:
          type: integer
          description: 第几次运行，从 1 开始按上报顺序递增；同一 `batch_id + run_seq` 唯一
          example: 2
        counts: { $ref: "#/components/schemas/Counts" }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ImportItemResult" }

    ImportBatchDetail:
      type: object
      description: |
        批次汇总 + 逐次运行明细。顶层 `counts` 是**最近一次**运行的快照（与 `import_batch` 一致），
        每一轮的计数在 `runs` 里，按 `run_seq` 升序。
      required: [batch_id, counts, errors, run_count, runs]
      properties:
        batch_id: { type: string }
        counts: { $ref: "#/components/schemas/Counts" }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ImportItemResult" }
        run_count:
          type: integer
          description: 该 batch_id 被提交的总次数
          example: 2
        last_run_at:
          type: string
          format: date-time
          nullable: true
        runs:
          type: array
          items: { $ref: "#/components/schemas/ImportBatchRun" }

    ImportItemResult:
      type: object
      required: [source_id, result]
      properties:
        source_id: { type: string }
        result:
          type: string
          enum: [inserted, updated, unchanged, rejected]
        work_id:
          type: string
          nullable: true
          description: rejected 时为 null
        code:
          type: string
          nullable: true
          description: |
            逐条错误码，走本数组而不走统一错误信封——一条坏记录不该拖垮整批。
            `DUPLICATE_IN_BATCH` 只是提示（同批内 source_id 重复，最后一次生效），不算失败。
          enum:
            - TITLE_REQUIRED
            - INVALID_TYPE
            - RATING_OUT_OF_SCALE
            - DUPLICATE_IN_BATCH
            - INTERNAL_ERROR
        message:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      description: 统一错误信封，接口②③④共用（接口①是平台主动拉取，失败记适配器日志）
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - INVALID_CREDENTIALS
                - BAD_REQUEST
                - WORK_NOT_FOUND
                - USERNAME_TAKEN
                - COLLECTION_REQUIRED
                - BATCH_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
              description: 面向开发者的说明，不直接展示给终端用户
      example:
        error: { code: WORK_NOT_FOUND, message: 作品不存在 }

    # --- 阶段 2 ---------------------------------------------------------------

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          example: alice
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        device_label:
          type: string
          maxLength: 64
          nullable: true
          description: 客户端自报的设备标识，仅用于展示与排查，不参与鉴权
          example: android

    CreateAccountRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password

    User:
      type: object
      required: [user_id, username]
      properties:
        user_id:
          type: string
          description: 平台生成的不透明标识，客户端**不得解析**
          example: U-9k2m0p7qz58f3a1
        username:
          type: string
          example: alice
        display_name:
          type: string
          nullable: true
          description: 首期不提供，恒为 `null`；客户端回落到 `username`
        created_at:
          type: string
          format: date-time
          nullable: true

    SessionResponse:
      type: object
      required: [token, expires_at, user]
      properties:
        token:
          type: string
          description: 会话令牌，只在此处返回一次；服务端只保存其哈希
          example: 9Zk3m0p7qz58f3a1k2m0p7qz58f3a1k2m0p7qz58f
        expires_at:
          type: string
          format: date-time
          description: 固定 30 天，不滑动续期；到期需重新登录
        user:
          $ref: "#/components/schemas/User"

    CollectionUpdateRequest:
      type: object
      description: 只接受「目标状态」，不提供 toggle——切换语义在网络重试时会反向操作
      properties:
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
          description: |
            `null` / 省略 = 已收藏但不设状态。取值非法返回 `400`，**不会**静默降级为 `null`。

    CollectionState:
      type: object
      required: [work_id, collected]
      description: |
        单条收藏状态。`collected: false` 表示未收藏（此时 `status` 与 `updated_at` 为 `null`），
        这是正常结果而不是错误——只有作品本身不存在才返回 404。
      properties:
        work_id:
          type: string
        collected:
          type: boolean
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
          description: "`null` 有两种含义：未收藏，或已收藏但未设状态——由 `collected` 区分"
        created_at:
          type: string
          format: date-time
          nullable: true
          description: 首次收藏时间；未收藏为 `null`
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: 最后一次状态变更时间，用于对账与排查；未收藏为 `null`

    CollectionItem:
      type: object
      description: 收藏列表项。作品字段与作品列表同源，但**不含 `summary`、`tags` 与评分**
      required: [work_id, work_type, title, status, created_at, updated_at]
      properties:
        work_id:
          type: string
        work_type:
          type: string
          enum: [anime, comic, game, novel]
        title:
          type: string
        cover_url:
          type: string
          nullable: true
          description: 平台封面代理地址；`null` 时客户端不发请求，直接显示占位图
        status:
          type: string
          nullable: true
          enum: [want, watching, watched]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CollectionPage:
      allOf:
        - $ref: "#/components/schemas/Paging"
        - type: object
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CollectionItem" }
